name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    # Fake env values so module-level constructions don't throw during
    # build's page-data collection step:
    # - DATABASE_URL: @neondatabase/serverless opens connections lazily,
    #   so this never actually tries to resolve. Network calls during
    #   static prerendering fall through the existing try/catch.
    # - RESEND_API_KEY: Resend's constructor (used at module load by
    #   the newsletter API routes) throws on a falsy key. Any truthy
    #   string passes the validation gate; real API calls during build
    #   never happen.
    env:
      DATABASE_URL: postgres://ci:ci@ci.invalid/ci?sslmode=require
      RESEND_API_KEY: re_ci_fake_key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: web
        run: pnpm install

      - name: Lint
        working-directory: web
        run: pnpm lint --max-warnings=0

      - name: Test
        working-directory: web
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm build
