name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    # Fake DATABASE_URL: lib/db.ts wraps the connection string at module
    # load but @neondatabase/serverless only opens connections lazily, so
    # the build proceeds. Any network calls during static prerendering
    # fail and fall through to the existing try/catch, returning [].
    env:
      DATABASE_URL: postgres://ci:ci@ci.invalid/ci?sslmode=require

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: web
        run: pnpm install

      - name: Lint
        working-directory: web
        run: pnpm lint --max-warnings=0

      - name: Test
        working-directory: web
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm build
